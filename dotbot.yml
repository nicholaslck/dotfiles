- defaults:
    link:
      create: true
      relink: true
      force: true
      glob: true

- clean: ["~"]
- clean:
    ~/:
      force: true
    ~/.config:
      force: true
      recursive: true
    ~/.local/bin:
      force: true
      recursive: true

- create:
    - ~/projects

- link:
    ~/.config/: config/**
    ~/.local/bin/: bin/**
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
